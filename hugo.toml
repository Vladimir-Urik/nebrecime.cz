baseURL = "https://nebrecime.cz/"
locale = "cs"
title = "Maturita Formalita"
uglyURLs = true

[security]
  allowContent = ["! ^text/org$"]

[markup]
  [markup.goldmark]
  [markup.goldmark.renderer]
      unsafe = true

enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5